# Helios Office — Backlog chức năng (nguồn sự thật duy nhất)
#
# Mục tiêu: đạt tương đương 1Office phần HRM + Workplace, không bỏ sót chức năng.
# Kiểm tra: `npm run audit:features` (thêm `-- --module LV`, `-- --phase 3`, `-- --write`, `-- --strict`).
#
# Quy tắc:
# - Mỗi chức năng nhỏ là một item có `id` dạng <MODULE>-<số>. Không xoá item; bỏ thì đặt `skipped` + `note`.
# - status: todo | doing | partial | done | skipped
#     partial = đã có một phần (API mock, thiếu guard, UI chưa nối, thiếu route...)
#     done    = đạt Definition of Done bên dưới. Audit báo lỗi nếu item done mà thiếu route hoặc route không có guard.
# - api: danh sách "METHOD /path" (bỏ tiền tố /api/v1, tham số viết :ten). Audit đối chiếu với controller thật.
# - public: true khi route cố ý không cần đăng nhập (careers, quên mật khẩu, health).
# - phase: mặc định lấy theo module, ghi đè ở item khi cần.
# - Commit/nhánh ghi mã item: `feat(LV-03): ...`, `feat/LV-03-leave-balance`.
#
# Definition of Done (mọi item):
#   [ ] Schema/migration (nếu cần)      [ ] API + DTO validate
#   [ ] Guard + permission + phạm vi dữ liệu   [ ] Audit log cho mutation
#   [ ] UI nối API thật, không mock     [ ] Test service tối thiểu
#   [ ] Cập nhật status ở đây + docs/progress-changelog.md
#
# Lưu ý: đánh số phase theo docs/roadmap.md (khác Phase 0-10 trong docs/implementation-plan.md).

version: 1

phases:
  0: Vá bảo mật & chuẩn hoá repo
  1: Hạ tầng dùng chung (file, queue, realtime, audit, phạm vi quyền)
  2: Ca làm việc, ngày lễ, engine tính công
  3: Engine phê duyệt & đơn từ
  4: Hồ sơ mở rộng & hợp đồng
  5: Lương, bảo hiểm, thuế
  6: Bảng tin & thông báo
  7: Tuyển dụng, onboarding, đào tạo, KPI, tài sản
  8: Công việc, tài liệu, lịch
  9: Báo cáo, tích hợp, mobile, dọn nợ kỹ thuật
  10: Ngoài phạm vi

