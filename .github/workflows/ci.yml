name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build, feature audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The apps read .env at build/test time; the example values are enough for CI
      # (e2e tests stub the database and Keycloak).
      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + e2e)
        run: npm run test

      - name: Feature audit (backlog vs. code)
        run: npm run audit:features -- --strict

      - name: Build
        run: npm run build
