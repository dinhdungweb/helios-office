services:
  postgres:
    image: postgres:18
    container_name: helios-postgres
    environment:
      POSTGRES_DB: helios_office
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios_office"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helios-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.2
    container_name: helios-keycloak
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: helios-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: helios
      MINIO_ROOT_PASSWORD: helios-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
